name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: DeLaGuardo/setup-clojure@master
        with:
          cli: latest
      - run: clj -M:test
      - run: clj -M:lint
